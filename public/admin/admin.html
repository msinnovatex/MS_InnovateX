<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MS InnovateX Admin</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf2ff;background:#030914}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123c76,#07142d 42%,#030914);min-height:100vh}button,input,textarea{font:inherit}.wrap{max-width:1450px;margin:auto;padding:18px}.card{background:#071a3aee;border:1px solid #2b5186;border-radius:18px;padding:20px;box-shadow:0 20px 60px #0005}.login{max-width:430px;margin:12vh auto}.title{font-size:28px;font-weight:900}.muted{color:#9fb0cc;font-size:13px}.label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#b9c8df;margin:14px 0 6px}.input,.area{width:100%;background:#04122a;color:#fff;border:1px solid #24477c;border-radius:11px;padding:11px 12px}.area{min-height:90px;resize:vertical}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;color:#fff;background:#1264ff;cursor:pointer}.btn.gray{background:#15345f}.btn.red{background:#a51f3c}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #285084;background:#081d3e;color:#cfe0f8;padding:9px 12px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#1264ff;border-color:#1264ff;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{background:#04122a;border:1px solid #23477e;border-radius:14px;padding:14px}.switch{display:flex;align-items:center;gap:8px;font-weight:800}.switch input{width:19px;height:19px;accent-color:#1264ff}.preview{max-width:300px;max-height:170px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid #31598e}.notice{padding:10px 12px;border-radius:10px;margin-bottom:12px;background:#0b3b2c;border:1px solid #2d9b72;color:#b1f3d5}.error{background:#4b1724;border-color:#a33a55;color:#ffbdc9}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:10px;border-bottom:1px solid #1d3962;text-align:left;vertical-align:top;font-size:12px}.hidden{display:none!important}.table th{font-size:10px;color:#75e1ff;text-transform:uppercase}.scroll{overflow:auto}.loading{position:fixed;inset:0;background:#020817aa;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:9999}.loading-box{background:#071a3a;border:1px solid #2b5186;border-radius:14px;padding:18px 24px;box-shadow:0 20px 60px #0008;font-weight:900;display:flex;align-items:center;gap:12px}.spinner{width:20px;height:20px;border:3px solid #31598e;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading{position:fixed;inset:0;background:#020817aa;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:9999}.loading-box{background:#071a3a;border:1px solid #2b5186;border-radius:14px;padding:18px 24px;box-shadow:0 20px 60px #0008;font-weight:900;display:flex;align-items:center;gap:12px}.spinner{width:20px;height:20px;border:3px solid #31598e;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.badge{background:#0c3972;color:#9cecff;border-radius:99px;padding:3px 8px;font-weight:800}@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}.wrap{padding:10px}.top{align-items:flex-start;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.tab{width:100%;text-align:center}.table{min-width:680px}.scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.card{padding:15px;border-radius:14px}.title{font-size:22px}.preview{max-width:100%;height:auto}.btn{min-height:42px}}@media(max-width:480px){.wrap{padding:8px}.tabs{grid-template-columns:1fr}.top .btn{width:100%}.top>div{width:100%}.grid,.grid2{grid-template-columns:1fr}.input,.area{font-size:16px}.table{min-width:620px}.loading-box{margin:16px;width:calc(100% - 32px);justify-content:center}.notice{font-size:13px}}
</style>
</head>
<body><div id="root"></div>
<script>
function setBusy(on,label='Saving...'){let x=document.getElementById('global-loading');if(on){if(!x){x=document.createElement('div');x.id='global-loading';x.className='loading';x.innerHTML='<div class="loading-box"><span class="spinner"></span><span id="global-loading-text"></span></div>';document.body.appendChild(x)}document.getElementById('global-loading-text').textContent=label}else if(x)x.remove()}
const BASE=(new URLSearchParams(location.search).get('api')||window.ADMIN_API_BASE_URL||location.origin).replace(/\/$/,'');let C=null,S=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(p,o={}){const method=String(o.method||'GET').toUpperCase();const busy=method!=='GET'&&!o.noLoading;if(busy)setBusy(true,method==='DELETE'?'Deleting...':p.includes('/login')?'Signing in...':p.includes('/advertisement')?'Publishing...':'Saving...');try{const r=await fetch(BASE+p,{credentials:'include',headers:{'Content-Type':'application/json',...(o.headers||{})},...o});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error(d?.error||('Request failed '+r.status));return d}finally{if(busy)setBusy(false)}}
function note(msg,bad=false){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice'+(bad?' error':'');n.textContent=msg;document.querySelector('.card')?.prepend(n)}
async function start(){try{if(!(await api('/api/admin/me')).ok)return login();C=await api('/api/admin/config');S=(await api('/api/admin/submissions')).submissions;panel()}catch(e){login(e.message)}}
function login(err=''){root.innerHTML='<div class="card login"><div class="title">MS InnovateX Admin</div><p class="muted">Secure control panel</p>'+(err?'<div class="notice error">'+esc(err)+'</div>':'')+'<form id="lf"><label class="label">Username</label><input class="input" id="u" autocomplete="username" required><label class="label">Password</label><input class="input" id="p" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:16px">Sign in</button></form></div>';lf.onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});C=await api('/api/admin/config');S=(await api('/api/admin/submissions')).submissions;panel()}catch(x){login(x.message)}}}
function panel(){root.innerHTML='<div class="wrap"><div class="top"><div><div class="title">MS InnovateX Control Panel</div><div class="muted">Firebase RTDB root: <b>MSINNOVATEX</b></div></div><button class="btn gray" id="lo">Logout</button></div><div class="tabs"><button class="tab active" data-x="stats">Stats</button><button class="tab" data-x="meta">SEO / Meta</button><button class="tab" data-x="ad">Advertisement</button><button class="tab" data-x="sub">Submissions</button><button class="tab" data-x="security">Security</button></div><div id="content"></div></div>';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.x)});lo.onclick=async()=>{await api('/api/admin/logout',{method:'POST'});login()};render('stats')}
function render(x){if(x==='stats')stats();if(x==='meta')meta();if(x==='ad')ad();if(x==='sub')sub();if(x==='security')security()}
function stats(){const s=C.stats||{},a=s.items||[];content.innerHTML='<div class="card"><div class="top"><div><h2>Homepage Stats Bar</h2><div class="muted">Hide/unhide the complete strip. Edit values when visible.</div></div><label class="switch"><input id="sv" type="checkbox" '+(s.visible!==false?'checked':'')+'> Show</label></div><div class="grid">'+a.map((x,i)=>'<div class="box"><b>'+esc(x.label)+'</b><label class="label">Value</label><input class="input v" data-i="'+i+'" type="number" min="0" value="'+esc(x.value??0)+'"><label class="label">Suffix</label><input class="input sf" data-i="'+i+'" value="'+esc(x.suffix||'')+'"><label class="label">Label</label><input class="input lb" data-i="'+i+'" value="'+esc(x.label||'')+'">'+(x.isText?'<label class="label">Text</label><input class="input tx" data-i="'+i+'" value="'+esc(x.text||'Pan India')+'">':'')+'</div>').join('')+'</div><button class="btn" id="saveS" style="margin-top:15px">Save Stats</button></div>';saveS.onclick=async()=>{try{const items=a.map((x,i)=>({...x,value:Number(document.querySelector('.v[data-i="'+i+'"]')?.value||0),suffix:document.querySelector('.sf[data-i="'+i+'"]')?.value||'',label:document.querySelector('.lb[data-i="'+i+'"]')?.value||'',text:document.querySelector('.tx[data-i="'+i+'"]')?.value||x.text||''}));await api('/api/admin/config/stats',{method:'PUT',body:JSON.stringify({visible:sv.checked,items})});C=await api('/api/admin/config');note('Stats saved.')}catch(e){note(e.message,true)}}}
function meta(){const g=C.meta?.global||{},p=C.meta?.pages||{},keys=['/','/about','/services','/internship','/contact','/email-marketing','/careers'];content.innerHTML='<div class="card"><h2>Global SEO</h2><label class="label">Title</label><input class="input" id="gt" value="'+esc(g.title)+'"><label class="label">Description</label><textarea class="area" id="gd">'+esc(g.description)+'</textarea><label class="label">Keywords</label><input class="input" id="gk" value="'+esc(g.keywords)+'"><label class="label">OG image URL</label><input class="input" id="go" value="'+esc(g.ogImage)+'"><div class="top" style="margin-top:22px"><div><h3 style="margin:0">Additional Meta Tags</h3><div class="muted">Add custom name/property/http-equiv tags globally.</div></div><button type="button" class="btn gray" id="addGlobalMeta">+ Add Meta Tag</button></div><div id="globalMeta">'+customRows(g.custom,'global')+'</div><h2 style="margin-top:28px">Page SEO</h2>'+keys.map(k=>'<div class="box" style="margin:10px 0"><div class="top"><b>'+esc(k)+'</b><button type="button" class="btn gray add-page-meta" data-page="'+esc(k)+'">+ Add Meta Tag</button></div><label class="label">Title</label><input class="input pt" data-p="'+esc(k)+'" value="'+esc(p[k]?.title||'')+'"><label class="label">Description</label><textarea class="area pd" data-p="'+esc(k)+'">'+esc(p[k]?.description||'')+'</textarea><label class="label">Keywords</label><input class="input pk" data-p="'+esc(k)+'" value="'+esc(p[k]?.keywords||'')+'"><div class="muted" style="margin-top:12px">Custom tags for this page</div><div class="pageMeta" data-page="'+esc(k)+'">'+customRows(p[k]?.custom,'page',k)+'</div></div>').join('')+'<button class="btn" id="saveM">Save SEO</button></div>';
function addRow(container,scope,page){const row=document.createElement('div');row.className='box custom-row';row.dataset.scope=scope;row.dataset.page=page||'';row.style.margin='8px 0';row.innerHTML='<div class="grid2"><div><label class="label">Attribute</label><select class="input ck"><option value="name">name</option><option value="property">property</option><option value="http-equiv">http-equiv</option></select></div><div><label class="label">Key</label><input class="input cvk" placeholder="author / robots / theme-color"></div></div><label class="label">Content</label><input class="input cvc" placeholder="Meta content"><button type="button" class="btn red remove-meta" style="margin-top:8px">Remove</button>';container.appendChild(row)}
function collectMeta(scope,page){return [...document.querySelectorAll('.custom-row')].filter(r=>r.dataset.scope===scope&&(scope!=='page'||r.dataset.page===page)).map(r=>({type:r.querySelector('.ck').value,key:r.querySelector('.cvk').value.trim(),content:r.querySelector('.cvc').value.trim()})).filter(x=>x.key&&x.content).slice(0,50)}
document.getElementById('addGlobalMeta').onclick=()=>addRow(document.getElementById('globalMeta'),'global','');
document.querySelectorAll('.add-page-meta').forEach(b=>b.onclick=()=>addRow(document.querySelector('.pageMeta[data-page="'+b.dataset.page+'"]'),'page',b.dataset.page));
document.querySelectorAll('.remove-meta').forEach(b=>b.onclick=()=>b.closest('.custom-row').remove());
saveM.onclick=async()=>{try{const next={global:{title:gt.value,description:gd.value,keywords:gk.value,ogImage:go.value,custom:collectMeta('global','')},pages:{}};keys.forEach(k=>next.pages[k]={title:document.querySelector('.pt[data-p="'+k+'"]').value,description:document.querySelector('.pd[data-p="'+k+'"]').value,keywords:document.querySelector('.pk[data-p="'+k+'"]').value,custom:collectMeta('page',k)});await api('/api/admin/config/meta',{method:'PUT',body:JSON.stringify(next)});C=await api('/api/admin/config');note('SEO settings saved.')}catch(e){note(e.message,true)}}}
function ad(){const a=C.advertisement||{};content.innerHTML='<div class="card"><div class="top"><div><h2>Advertisement Popup</h2><div class="muted">Shown on every public page except Email Marketing and Careers.</div></div><label class="switch"><input id="aa" type="checkbox" '+(a.active?'checked':'')+'> Active</label></div><label class="label">Title</label><input class="input" id="at" value="'+esc(a.title)+'"><label class="label">Text</label><textarea class="area" id="ax">'+esc(a.text)+'</textarea><div class="grid2"><div><label class="label">Button text</label><input class="input" id="ab" value="'+esc(a.buttonText)+'"></div><div><label class="label">Button URL</label><input class="input" id="au" value="'+esc(a.buttonUrl)+'"></div></div><label class="label">Image</label><input class="input" id="af" type="file" accept="image/*"><div class="muted" style="margin-top:5px">Image is compressed in the browser and stored in RTDB. Keep it under 650 KB.</div><img id="ap" class="preview '+(a.image?'':'hidden')+'" src="'+esc(a.image||'')+'"><div style="margin-top:15px"><button class="btn" id="saveA">Save / Publish</button> <button class="btn red" id="delA">Delete</button></div></div>';af.onchange=async()=>{try{const d=await compress(af.files[0]);ap.src=d;ap.classList.remove('hidden');ap.dataset.data=d}catch(e){note(e.message,true)}};saveA.onclick=async()=>{try{const image=ap.dataset.data||a.image||'';await api('/api/admin/config/advertisement',{method:'PUT',body:JSON.stringify({active:aa.checked,id:a.id||crypto.randomUUID(),title:at.value,text:ax.value,image,buttonText:ab.value,buttonUrl:au.value})});C=await api('/api/admin/config');note('Advertisement saved.');ad()}catch(e){note(e.message,true)}};delA.onclick=async()=>{if(!confirm('Delete advertisement?'))return;await api('/api/admin/advertisement',{method:'DELETE'});C=await api('/api/admin/config');ad()}}
function compress(file){return new Promise((resolve,reject)=>{if(!file)return reject(Error('Choose an image first.'));const r=new FileReader(),i=new Image();r.onload=()=>i.src=r.result;r.onerror=reject;i.onload=()=>{const scale=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*scale);c.height=Math.round(i.height*scale);c.getContext('2d').drawImage(i,0,0,c.width,c.height);let q=.82,d=c.toDataURL('image/webp',q);while(d.length>650000&&q>.35){q-=.08;d=c.toDataURL('image/webp',q)}d.length>650000?reject(Error('Image could not be compressed under 650 KB.')):resolve(d)};r.readAsDataURL(file)})}
function security(){content.innerHTML='<div class="card"><h2>Admin Credentials</h2><div class="muted">Your admin username and password are stored in Firebase as a salted scrypt hash. Environment credentials are only used for first-time bootstrap.</div><label class="label">Current password</label><input class="input" id="cp" type="password" autocomplete="current-password"><label class="label">New username</label><input class="input" id="nu" autocomplete="username" placeholder="admin@example.com"><label class="label">New password</label><input class="input" id="np" type="password" autocomplete="new-password" placeholder="At least 12 characters"><label class="label">Confirm new password</label><input class="input" id="ncp" type="password" autocomplete="new-password"><button class="btn" id="saveCred" style="margin-top:15px">Change Username & Password</button></div>';saveCred.onclick=async()=>{if(np.value!==ncp.value)return note('New passwords do not match.',true);try{const d=await api('/api/admin/credentials',{method:'PUT',body:JSON.stringify({currentPassword:cp.value,username:nu.value,password:np.value})});note('Credentials changed successfully. New username: '+d.username)}catch(e){note(e.message,true)}}}
function sub(){const types=[['contact','Contact'],['internship','Internship'],['emailMarketing','Email Marketing']];content.innerHTML='<div class="card"><div class="top"><div><h2>Form Submissions</h2><div class="muted">Latest 100 per form type.</div></div><button class="btn gray" id="rs">Refresh</button></div>'+types.map(([t,n])=>{const rows=Object.entries(S?.[t]||{}).sort((a,b)=>(b[1]?.createdAt||0)-(a[1]?.createdAt||0));return '<h3>'+n+' <span class="badge">'+rows.length+'</span></h3><div class="scroll"><table class="table"><thead><tr><th>Date</th><th>Details</th><th>Status</th><th></th></tr></thead><tbody>'+ (rows.length?rows.map(([id,x])=>'<tr><td>'+new Date(x.createdAt||0).toLocaleString()+'</td><td>'+Object.entries(x).filter(([k])=>!['createdAt','status'].includes(k)).map(([k,v])=>'<div><b>'+esc(k)+':</b> '+esc(v)+'</div>').join('')+'</td><td>'+esc(x.status||'new')+'</td><td><button class="btn red" onclick="removeSub(\''+t+'\',\''+id+'\')">Delete</button></td></tr>').join(''):'<tr><td colspan="4" class="muted">No submissions.</td></tr>')+'</tbody></table></div>'}).join('')+'</div>';rs.onclick=async()=>{S=(await api('/api/admin/submissions')).submissions;sub()}}
window.removeSub=async(t,id)=>{if(!confirm('Delete this submission permanently?'))return;await api('/api/admin/submissions/'+t+'/'+id,{method:'DELETE'});S=(await api('/api/admin/submissions')).submissions;sub()};
start();
</script></body></html>
