<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offer Internship Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#e8eef8;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:28px;font-weight:900}.muted{color:#9fb0c8}.card{background:#0d1b2e;border:1px solid #1e3553;border-radius:22px;padding:22px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{background:#101f34;border:1px solid #213b5c;border-radius:18px;padding:18px}.metric span{display:block;color:#9fb0c8;font-size:13px}.metric strong{display:block;font-size:28px;margin-top:5px}.input,.select{width:100%;border:1px solid #2b4565;background:#081526;color:#fff;border-radius:12px;padding:11px 13px;margin-top:7px}.btn{border:0;border-radius:12px;background:#1264ff;color:white;padding:11px 16px;font-weight:800;cursor:pointer}.green{background:#0a9f65}.red{background:#dc3545}.gray{background:#263951}.label{display:block;font-weight:800;font-size:13px;margin-top:14px}.toolbar{display:grid;grid-template-columns:1fr 180px;gap:12px;margin:16px 0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1100px}.table th,.table td{padding:12px;border-bottom:1px solid #1e3553;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:900}.pending{background:#3b2d08;color:#ffd56a}.approved{background:#073b2a;color:#69e8b2}.rejected{background:#42141b;color:#ff9da8}.shot{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #29476c;cursor:pointer}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{padding:12px 14px;border-radius:12px;background:#12365e;margin-bottom:15px;animation:noticeIn .28s ease both}.notice.success{background:#073b2a;border:1px solid #176b4c;color:#9ff0c8}.bad{background:#4b1720}.empty{text-align:center;padding:40px;color:#9fb0c8}@keyframes noticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@keyframes btnPop{0%{transform:scale(1)}45%{transform:scale(.94)}100%{transform:scale(1)}}button{transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}button:not(:disabled):active{transform:scale(.96)}button.is-success{animation:btnPop .35s ease}button:disabled{cursor:not-allowed;opacity:.65}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.wrap{padding:14px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><div class="title">Offer Internship Admin</div><div class="muted">Review internship applications, payment UTRs and screenshots.</div></div><button class="btn gray" id="logout" style="display:none">Logout</button></div><div id="root"></div></main><script>
const root=document.getElementById('root'),BASE=(new URLSearchParams(location.search).get('api')||window.ADMIN_API_BASE_URL||location.origin).replace(/\/$/,'');let apps={},config=null;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){const r=await fetch(BASE+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function note(msg,bad=false){document.querySelectorAll('.notice').forEach(x=>x.remove());const n=document.createElement('div');n.className='notice '+(bad?'bad':'success');n.textContent=msg;root.prepend(n);setTimeout(()=>n.remove(),4200)}
function actionButton(id,busyText){const b=document.getElementById(id);if(!b)return null;const original=b.textContent;b.disabled=true;b.textContent=busyText;return ()=>{b.disabled=false;b.textContent=original;b.classList.add('is-success');setTimeout(()=>b.classList.remove('is-success'),500)}}
function login(msg=''){document.getElementById('logout').style.display='none';root.innerHTML='<div class="card" style="max-width:460px;margin:50px auto"><h2>Admin Sign in</h2>'+(msg?'<div class="notice bad">'+esc(msg)+'</div>':'')+'<label class="label">Username</label><input id="u" class="input" autocomplete="username"><label class="label">Password</label><input id="p" class="input" type="password" autocomplete="current-password"><button class="btn" style="margin-top:16px;width:100%" id="in">Sign in</button></div>';document.getElementById('in').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});await load()}catch(e){login(e.message)}}}
async function load(){config=(await api('/api/admin/config')).offerInternship||{enabled:true,amount:500,upi:'soumyanshu.sahoo@ybl',merchantName:'MS InnovateX Pvt. Ltd.'};apps=(await api('/api/admin/offerinternship')).applications||{};document.getElementById('logout').style.display='block';render()}
function render(){const all=Object.entries(apps).sort((a,b)=>Number(b[1]?.createdAt||0)-Number(a[1]?.createdAt||0)),pending=all.filter(x=>(x[1].status||'pending')==='pending').length,approved=all.filter(x=>x[1].status==='approved').length,rejected=all.filter(x=>x[1].status==='rejected').length;root.innerHTML='<div class="card"><div class="top"><div><h2>Payment Settings</h2><div class="muted">Admin controls the amount shown to applicants.</div></div><button class="btn" id="saveConfig">Save Payment Settings</button></div><div class="grid"><div><label class="label">Internship amount (INR)</label><input id="amount" class="input" type="number" min="1" max="100000" value="'+esc(config?.amount||500)+'"></div><div><label class="label">UPI ID</label><input id="upi" class="input" value="'+esc(config?.upi||'soumyanshu.sahoo@ybl')+'"></div><div><label class="label">Merchant name</label><input id="merchant" class="input" value="'+esc(config?.merchantName||'MS InnovateX Pvt. Ltd.')+'"></div><div><label class="label">Counts</label><div style="margin-top:12px;font-weight:900">Pending '+pending+' · Approved '+approved+' · Rejected '+rejected+'</div></div></div></div><div class="grid"><div class="metric"><span>Total applications</span><strong>'+all.length+'</strong></div><div class="metric"><span>Pending</span><strong>'+pending+'</strong></div><div class="metric"><span>Approved</span><strong>'+approved+'</strong></div><div class="metric"><span>Rejected</span><strong>'+rejected+'</strong></div></div><div class="card"><div class="top"><div><h2>Applications</h2><div class="muted">Firebase: MSINNOVATEX/offerinternship</div></div><button class="btn gray" id="refresh">Refresh</button></div><div class="toolbar"><input id="search" class="input" placeholder="Search name, email, UTR, degree..."><select id="filter" class="select"><option value="">All statuses</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Applicant</th><th>Contact</th><th>Degree</th><th>Payment</th><th>Screenshot</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>';draw();document.getElementById('refresh').onclick=async()=>{apps=(await api('/api/admin/offerinternship')).applications||{};render()};document.getElementById('saveConfig').onclick=saveConfig;document.getElementById('search').oninput=draw;document.getElementById('filter').onchange=draw}
function draw(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,all=Object.entries(apps).sort((a,b)=>Number(b[1]?.createdAt||0)-Number(a[1]?.createdAt||0)).filter(([id,x])=>(!f||(x.status||'pending')===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('rows').innerHTML=all.length?all.map(([id,x])=>{const st=x.status||'pending';return '<tr><td>'+new Date(Number(x.createdAt||0)).toLocaleString()+'</td><td><b>'+esc(x.fullName)+'</b><div class="muted">'+esc(x.email)+'</div></td><td>WhatsApp: '+esc(x.whatsapp)+'<br>Phone: '+esc(x.phone)+'</td><td>'+esc(x.degree)+'</td><td><b>₹'+esc(x.amount)+'</b><div style="margin-top:5px"><b>UTR:</b> '+esc(x.utr)+'</div><div class="muted">'+esc(x.upi)+'</div></td><td><img class="shot" src="'+esc(x.paymentScreenshot)+'" alt="Payment screenshot" onclick="openShot(this.src)"></td><td><span class="badge '+st+'">'+esc(st)+'</span>'+(st==='rejected'?'<div class="muted" style="margin-top:6px">Reason: '+esc(x.rejectionReason||'')+'</div>':'')+'</td><td><div class="actions">'+(st!=='approved'?'<button class="btn green" onclick="approve(\''+id+'\')">Approve</button>':'')+(st!=='rejected'?'<button class="btn red" onclick="rejectApp(\''+id+'\')">Reject</button>':'')+'<button class="btn gray" onclick="deleteApp(\''+id+'\')">Delete</button></div></td></tr>'}).join(''):'<tr><td colspan="8" class="empty">No applications found.</td></tr>'}
async function saveConfig(){const done=actionButton('saveConfig','Saving...');try{await api('/api/admin/config-offer-internship',{method:'PUT',body:JSON.stringify({enabled:true,amount:Number(document.getElementById('amount').value),upi:document.getElementById('upi').value,merchantName:document.getElementById('merchant').value})});config=(await api('/api/admin/config')).offerInternship;render();note('✓ Payment settings saved successfully.');}catch(e){note(e.message,true)}finally{if(done)done()}}
async function approve(id){if(!confirm('Approve this internship application?'))return;try{await api('/api/admin/offerinternship/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({action:'approve'})});apps=(await api('/api/admin/offerinternship')).applications||{};render();note('✓ Application approved successfully.')}catch(e){note(e.message,true)}}
async function rejectApp(id){const reason=prompt('Enter the reason for rejection:');if(reason===null)return;if(!reason.trim())return alert('Rejection reason is required.');if(!confirm('Reject this application with this reason?'))return;try{await api('/api/admin/offerinternship/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({action:'reject',reason:reason.trim()})});apps=(await api('/api/admin/offerinternship')).applications||{};render();note('✓ Application rejected successfully.')}catch(e){note(e.message,true)}}
async function deleteApp(id){if(!confirm('Delete this application permanently? This cannot be undone.'))return;try{await api('/api/admin/offerinternship/'+encodeURIComponent(id),{method:'DELETE'});delete apps[id];render();note('✓ Application deleted successfully.')}catch(e){note(e.message,true)}}
function openShot(src){const w=window.open('','_blank');if(w)w.document.write('<title>Payment Screenshot</title><body style="margin:0;background:#111;display:grid;place-items:center"><img src="'+src+'" style="max-width:100%;max-height:100vh;object-fit:contain"></body>')}
document.getElementById('logout').onclick=async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{login()}};
(async()=>{try{const me=await api('/api/admin/me');if(!me.ok)return login();await load()}catch(e){login(e.message)}})();
</script></body></html>
